name: V29 Accurate Build

on:
  push:
    branches:
      - "feature/v29-clean-restart"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -f MotionCanvas-v29-restart-clean.zip
          unzip -t MotionCanvas-v29-restart-clean.zip >/dev/null

      - name: Extract V29
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q MotionCanvas-v29-restart-clean.zip -d build-source

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply V29 compatibility patch
        run: python3 ci/v29_patch.py

      - name: Apply Media3 compatibility patch
        run: python3 ci/v29_media3_fix.py

      - name: Validate patched source
        run: |
          grep -n 'media3' build-source/app/build.gradle.kts
          ! grep -q 'androidx.media3:.*:1.11.1' build-source/app/build.gradle.kts

      - name: Validate patched source
        run: |
          test -f build-source/app/build.gradle.kts
          test -f build-source/app/src/main/java/com/smitnk/motioncanvas/MainActivity.kt
          grep -R "class AdvancedEngineWiring" build-source/app/src/main/java/com/smitnk/motioncanvas/AdvancedEngineWiring.kt

      - name: Generate Gradle wrapper
        working-directory: build-source
        run: gradle wrapper --gradle-version 8.9

      - name: Assemble debug APK
        working-directory: build-source
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: motioncanvas-v29-accurate-debug-apk
          path: build-source/app/build/outputs/apk/debug/*.apk
