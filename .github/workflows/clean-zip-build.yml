name: Clean V29 ZIP Build

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v29-clean-restart"

jobs:
  build:
    if: ${{ hashFiles('MotionCanvas-v29-restart-clean.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract clean V29 project
        run: |
          rm -rf build-source
          mkdir -p build-source
          unzip -q MotionCanvas-v29-restart-clean.zip -d build-source

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build clean V29 APK
        working-directory: build-source
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motioncanvas-v29-clean-debug-apk
          path: build-source/app/build/outputs/apk/debug/*.apk
